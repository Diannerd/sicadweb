<body>
  <div class="wrap">
    <div class="card">
      <h1>Login Dosen</h1>
      <p>Masukkan Username dan Kata Sandi</p>
      <form id="loginForm">
        <div class="form-group">
          <label>Username Dosen</label>
          <input type="text" id="username" placeholder="Contoh: dosen01" required>
        </div>
        <div class="form-group">
          <label>Kata Sandi</label>
          <input type="password" id="password" placeholder="Masukkan kata sandi" required>
        </div>
        <button type="submit" class="btn btn-primary">Masuk ke Dashboard</button>
        <a href="index.html" class="btn-back">← Kembali</a>
      </form>
    </div>
  </div>

  <script src="js/auth.js"></script>
  <script>
    document.getElementById('loginForm').addEventListener('submit', function (e) {
      e.preventDefault();
      const userVal = document.getElementById('username').value.trim();
      const passVal = document.getElementById('password').value;

      login('dosen', userVal, passVal, 'pages/dashboardDosen.html');
    });
  </script>
</body>
</html>
