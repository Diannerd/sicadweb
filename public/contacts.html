<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Support - ITU siCAD</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="bg-[#f8fafc] flex h-screen overflow-hidden">

    <aside class="w-64 bg-[#1e293b] text-slate-300 flex flex-col shrink-0">
        <div class="p-8 flex flex-col items-center border-b border-slate-700/50">
            <div class="w-12 h-12 bg-white rounded-full flex items-center justify-center mb-3">
                <span class="text-[#1e293b] font-black text-xl">ITU</span>
            </div>
            <h2 class="text-[10px] font-bold text-white uppercase text-center">Indonesia Tech University</h2>
        </div>
        <nav class="flex-1 px-4 py-6 space-y-2">
            <a href="dashboardDosen.html" class="flex items-center space-x-3 hover:bg-slate-800 px-4 py-3 rounded-lg transition">
                <i class="fas fa-home w-5"></i> <span>Dashboard</span>
            </a>
            <a href="freeMaterials.html" class="flex items-center space-x-3 hover:bg-slate-800 px-4 py-3 rounded-lg transition">
                <i class="fas fa-book-open w-5"></i> <span>Free Materials</span>
            </a>
            <a href="contacts.html" class="flex items-center space-x-3 bg-blue-600 text-white px-4 py-3 rounded-lg font-medium shadow-lg">
                <i class="fas fa-envelope w-5"></i> <span>Contacts</span>
            </a>
        </nav>
        
        <div class="p-4 border-t border-slate-700/50">
            <button onclick="handleLogout()" class="flex items-center space-x-3 w-full hover:bg-red-500/10 text-slate-400 hover:text-red-400 px-4 py-3 rounded-lg transition">
                <i class="fas fa-sign-out-alt w-5"></i> <span>Logout</span>
            </button>
        </div>
    </aside>

    <main class="flex-1 overflow-y-auto">
        <header class="bg-white h-20 border-b flex items-center px-10 sticky top-0 z-10 space-x-4">
            <a href="dashboardDosen.html" class="text-slate-400 hover:text-blue-600 transition">
                <i class="fas fa-arrow-left text-lg"></i>
            </a>
            <h1 class="text-xl font-bold text-slate-800">Pusat Bantuan & Kontak</h1>
        </header>

        <div class="p-10 max-w-5xl mx-auto">
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                
                <div class="lg:col-span-1 space-y-6">
                    <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm hover:shadow-md transition">
                        <div class="text-blue-600 mb-4"><i class="fas fa-headset text-3xl"></i></div>
                        <h3 class="font-bold text-slate-800">IT Helpdesk</h3>
                        <p class="text-sm text-slate-500 mb-2">Masalah teknis & Login</p>
                        <a href="mailto:support@itu.ac.id" class="text-blue-600 font-medium text-sm hover:underline">support@itu.ac.id</a>
                    </div>

                    <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm hover:shadow-md transition">
                        <div class="text-indigo-600 mb-4"><i class="fas fa-university text-3xl"></i></div>
                        <h3 class="font-bold text-slate-800">BAAK ITU</h3>
                        <p class="text-sm text-slate-500 mb-2">Administrasi Nilai & KHS</p>
                        <a href="mailto:akademik@itu.ac.id" class="text-indigo-600 font-medium text-sm hover:underline">akademik@itu.ac.id</a>
                    </div>
                </div>

                <div class="lg:col-span-2 bg-white p-8 rounded-2xl border border-slate-200 shadow-sm">
                    <h3 class="text-xl font-bold text-slate-800 mb-6">Kirim Pesan Cepat</h3>
                    <form id="contactForm" class="space-y-4">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div>
                                <label class="block text-sm font-medium text-slate-700 mb-1">Nama Lengkap</label>
                                <input type="text" id="senderName" required class="w-full px-4 py-2 border border-slate-200 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition" placeholder="Nama Anda..">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-slate-700 mb-1">NIDN / NIM</label>
                                <input type="text" id="senderId" required class="w-full px-4 py-2 border border-slate-200 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition" placeholder="Identitas..">
                            </div>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1">Subjek</label>
                            <select id="subject" class="w-full px-4 py-2 border border-slate-200 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition cursor-pointer">
                                <option>Masalah Input Nilai</option>
                                <option>Gagal Download PDF</option>
                                <option>Perubahan Data Akun</option>
                                <option>Lainnya</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1">Pesan Kendala</label>
                            <textarea id="message" rows="4" required class="w-full px-4 py-2 border border-slate-200 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition" placeholder="Tuliskan secara detail kendala yang Anda alami..."></textarea>
                        </div>
                        <button type="submit" class="w-full bg-slate-900 text-white py-3 rounded-lg font-bold hover:bg-blue-600 shadow-lg active:transform active:scale-[0.98] transition-all duration-200">
                            <i class="fas fa-paper-plane mr-2"></i> Kirim Tiket Bantuan
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <script>
        // Logika Pengiriman Form
        document.getElementById('contactForm').addEventListener('submit', function(e) {
            e.preventDefault();

            // Ambil data (untuk simulasi)
            const name = document.getElementById('senderName').value;
            const subject = document.getElementById('subject').value;

            // Efek Loading
            const btn = e.target.querySelector('button');
            const originalText = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i> Mengirim...';

            // Simulasi pengiriman ke server
            setTimeout(() => {
                Swal.fire({
                    title: 'Berhasil Terkirim!',
                    text: `Halo ${name}, tiket bantuan mengenai "${subject}" telah diterima. Kami akan menghubungi Anda melalui email dalam 1x24 jam.`,
                    icon: 'success',
                    confirmButtonColor: '#1e293b',
                    confirmButtonText: 'Siap!'
                });

                // Reset Form
                document.getElementById('contactForm').reset();
                btn.disabled = false;
                btn.innerHTML = originalText;
            }, 1500);
        });

        // Logika Logout
        function handleLogout() {
            Swal.fire({
                title: 'Konfirmasi Keluar',
                text: "Apakah Anda yakin ingin mengakhiri sesi ini?",
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#d33',
                cancelButtonColor: '#1e293b',
                confirmButtonText: 'Ya, Logout',
                cancelButtonText: 'Batal'
            }).then((result) => {
                if (result.isConfirmed) {
                    window.location.href = 'index.html';
                }
            });
        }
    </script>
</body>
</html>
